# Costruisce il sito con `tools/home/build.js` e lo pubblica su GitHub Pages.
#
# Va scelto "GitHub Actions" come sorgente in Settings → Pages: con la
# pubblicazione dal branch il build non girerebbe e il bundle mancherebbe.
#
# Le action sono fissate per commit, non per tag: un tag si può spostare.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # Tutta la logica sta in `tools/home/build.js`, uguale in locale e qui:
      # costruisce i tool che hanno un package.json, copia le loro `public/`
      # e genera la home.
      - name: Build site
        run: node tools/home/build.js

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
